name: Bina APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - name: Pulihkan kunci tandatangan (jika ada)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > android/app/istiqamah-debug.keystore; fi
      - run: npx cap sync android
      - name: Versi app
        run: |
          V=$(node -p "require('./package.json').version")
          echo "APP_VER=$V" >> $GITHUB_ENV
      - name: Bina APK (debug, boleh pasang terus)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Namakan APK
        run: |
          VER=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "Istiqamah-v${VER}.apk"
          echo "VER=${VER}" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: Istiqamah-APK
          path: Istiqamah-v*.apk
      - name: Terbit Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-${{ github.run_number }}
          name: Istiqamah v${{ env.VER }} (build ${{ github.run_number }})
          files: Istiqamah-v*.apk
